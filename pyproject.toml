[project]
name = "plox-tools"
authors = [{ name = "bigpick",  email = "bigpick@codeplox.dev"}]
maintainers = [{ name = "bigpick",  email = "bigpick@codeplox.dev"}, { name = "Mike", email = "mike@codeplox.dev"}]
version = "0.0.0"
description = "A simple package that houses simple utilities for dealing with common tasks."
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",

  # Pick your license as you wish (see also "license" above)
  "License :: OSI Approved :: MIT License",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = ["pick"]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "pytest",
    "pytest-cov",
    "pylint",
    "mypy",
    "python-docs-theme",
    "Sphinx",
    "myst-parser",
    "sphinx-autoapi",
    "sphinx-autodoc-typehints",
    "pre-commit"
]

#[tool.uv]
#default-groups = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.sdist]
include = ["plox"]
exclude = ["**/test/*"]

[tool.hatch.build.targets.wheel]
include = ["plox"]
exclude = ["**/test/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = '--import-mode=importlib --cov-report term-missing --cov=plox -s'
python_files = "*test*.py"
markers = [ "integration: marks tests that have external dependencies (deselect with \"-m 'not integration'\")",]
log_cli = true
log_cli_level = "DEBUG"
