name: VERSION bump

on:
  pull_request:

jobs:
  check_version_modified:
    name: Check VERSION modified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base SHA
        id: base-sha
        run: echo "sha=$(git rev-parse origin/${{ github.event.pull_request.base.ref }})" >> $GITHUB_OUTPUT
      - name: check for modified code src files
        id: check_files
        run: |
          echo "=============== list modified files ==============="
          git diff --name-only "${{ steps.base-sha.outputs.sha }}" "${{ github.head_ref }}" > files.txt
          cat files.txt

          echo "========== check paths of modified files =========="
          while IFS= read -r file; do
            if [[ $file == VERSION ]]; then
              return 0
            fi
          done < files.txt
          return -1
